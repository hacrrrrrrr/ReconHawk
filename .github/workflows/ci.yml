name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: gofmt -w ./cmd/reconhawk
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/reconhawk
