name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/reconhawk-linux-amd64 ./cmd/reconhawk
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/reconhawk-linux-arm64 ./cmd/reconhawk
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/reconhawk-windows-amd64.exe ./cmd/reconhawk
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/reconhawk-darwin-amd64 ./cmd/reconhawk
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/reconhawk-darwin-arm64 ./cmd/reconhawk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
